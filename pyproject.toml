[project]
name = "talent-shift-exchange"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 130

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint.per-file-ignores]
"tse/eval/readme.py" = ["E501"]   # markdown tables are one line each
