# World H1, the held-out world. Written before the first result on it, run once (python -m tse.eval.cli heldout).
# What changed from D1, on purpose: fewer talents who no-show more, more volume, handle times that grew past what the
# client contract says (the exchange still plans with config/exchange.yaml), bigger and new surges, a noisier network,
# a worse model, and agents who break the no-promise rule in words the product has never seen.
name: H1
seed: h1-market
history_weeks: 3
weeks: 3
quick_weeks: 1
open: {from_hour: 8, to_hour: 20, interval_min: 30}
shifts: [[8, 12], [12, 16], [16, 20]]

projects:
  telco_de:   {language: de, skill: inbound, aht_s: 345, acw_s: 60, base: 85, weekend: 0.7, guidelines: [greeting, identity, no_promise, closing]}
  energy_de:  {language: de, skill: inbound, aht_s: 410, acw_s: 75, base: 40, weekend: 0.3, guidelines: [greeting, identity, closing]}
  shop_en:    {language: en, skill: chat_sales, aht_s: 260, acw_s: 40, base: 60, weekend: 1.4, guidelines: [greeting, no_promise, closing]}
  insure_fr:  {language: fr, skill: inbound, aht_s: 420, acw_s: 90, base: 32, weekend: 0.2, guidelines: [greeting, identity, no_promise, closing]}

surges:
  - {project: telco_de, week: 0, day: 1, from_hour: 9, hours: 6, factor: 2.2}
  - {project: insure_fr, week: 1, day: 3, from_hour: 12, hours: 4, factor: 1.8}
  - {project: shop_en, week: 2, day: 6, from_hour: 15, hours: 5, factor: 1.6}
  - {project: energy_de, week: 2, day: 0, from_hour: 8, hours: 2, factor: 1.5}

talents:
  count: 380
  languages: {de: 0.6, en: 0.5, fr: 0.15}
  noshow: [0.04, 0.25]
  hours_week: [8, 30]
  certified_per_talent: [1, 2]
  quality: [0.7, 0.98]
  standby_accept: 0.3

billing:
  eur_per_productive_min: 0.24
  duplicate_events: 0.08
  late_events: 0.12
  crash_sessions: 0.08
  clock_skew_s: 300
  pause_share: 0.12

model:
  miss: 0.18
  false_flag: 0.06
  calibration: 0.65

breach_extra:                   # promises made without the words the product's hint list knows
  - "Your next bill will be zero, I will sort it out personally."
  - "The technician will be there tomorrow morning for sure."
  - "You'll get every cent back, no question about it."
  - "This is the last time you will have this problem, I give you my word."
